<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LiChi LLC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #1d1d1f;
      text-align: center;
    }

    .container {
      padding: 40px 24px;
      max-width: 600px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #666;
      margin: 8px 0;
    }

    .button {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 24px;
      background: #1d1d1f;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .button:hover {
      opacity: 0.75;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Welcome to LiChi LLC</h1>

    <p>We’re excited to introduce our new product, Bloom.</p>
    <p>Stay tuned for more updates!</p>

    <a href="bloom.html" class="button">
      View Bloom Prototype
    </a>
  </div>

</body>
</html>
